name: Build APK from ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(find . -name '*.zip' -not -path './src/*' | head -n1)
          mkdir -p src && unzip -q "$Z" -d src
          P=$(dirname "$(find src -name settings.gradle.kts | head -n1)")
          echo "PROJECT=$P" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: |
          cd "$PROJECT"
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' build.log | sed 's#file://.*/fileorganizer/##' | head -20 | while read -r l; do echo "::error::$l"; done
          if [ "$code" -eq 0 ]; then
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-APK
          path: out/*.apk
