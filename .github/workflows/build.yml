name: Build APK from ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and extract latest project ZIP
        shell: bash
        run: |
          set -euo pipefail

          Z=""
          BEST=0

          while IFS= read -r -d '' f; do
            T="$(git log -1 --format=%ct -- "$f" 2>/dev/null || true)"
            if [[ -z "$T" ]]; then
              T="$(stat -c %Y "$f")"
            fi
            if (( T > BEST )); then
              BEST="$T"
              Z="$f"
            fi
          done < <(find . -type f -name '*.zip' \
            -not -path './.git/*' \
            -not -path './src/*' \
            -print0)

          if [[ -z "$Z" ]]; then
            echo "::error::저장소에서 프로젝트 ZIP 파일을 찾지 못했습니다. ZIP을 저장소에 업로드하고 커밋했는지 확인하세요."
            exit 1
          fi

          echo "::notice::사용할 ZIP: $Z"
          mkdir -p src
          unzip -q "$Z" -d src

          SETTINGS="$(find src -type f -name settings.gradle.kts -print -quit)"
          if [[ -z "$SETTINGS" ]]; then
            echo "::error::ZIP 안에서 settings.gradle.kts를 찾지 못했습니다."
            echo "ZIP 내부 구조를 확인하세요. 프로젝트 루트에 settings.gradle.kts가 있어야 합니다."
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "::notice::Gradle 프로젝트 경로: $PROJECT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cd "$PROJECT"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_CODE=${PIPESTATUS[0]}
          set -e

          if [[ "$BUILD_CODE" -eq 0 ]]; then
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
            echo "APK 빌드 성공"
          else
            echo "::error::APK 빌드 실패. build.log에서 최초 오류를 확인하세요."
          fi
          exit "$BUILD_CODE"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-build-log
          path: build.log
          if-no-files-found: ignore
